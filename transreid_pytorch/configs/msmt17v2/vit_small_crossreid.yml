MODEL:
  PRETRAIN_PATH: '/kaggle/working/weights/vit_small_pretrained.pth'  # PersonViT vits.lup checkpoint (set to your Kaggle path)
  PRETRAIN_HW_RATIO: 2
  METRIC_LOSS_TYPE: 'triplet'
  IF_LABELSMOOTH: 'off'
  IF_WITH_CENTER: 'no'
  NAME: 'transformer'
  NO_MARGIN: True
  DEVICE_ID: ('0')
  TRANSFORMER_TYPE: 'vit_small_patch16_224_TransReID'
  STRIDE_SIZE: [16, 16]

  # ── Text Alignment (VLM) ──────────────────────────────────────────
  TEXT_EMB_PATH: 'scripts/msmt17_embeddings.pt'  # per-PID SigLIP2 embeddings of MSMT17 captions
  TEXT_EMB_BY_PID: True                          # keys are int pids 0..1040
  TEXT_EMB_DIM: 768

  # Projector mode (TEXT_PROJ_HEAD: true) — uses MLP projector + warmup
  TEXT_PROJ_HEAD: false                          # false = use dist_loss family instead
  TEXT_ALIGN_WEIGHT: 0.3
  TEXT_ALIGN_LOSS: 'text_center'
  TEXT_ALIGN_TEMPERATURE: 0.1
  TEXT_PROJ_WARMUP_EPOCHS: 10

  # Dist-loss mode (TEXT_PROJ_HEAD: false) — similarity matrix losses
  TEXT_LOSS_TYPE: 'kl'                           # patched diagonal-removal implementation
  TEXT_LOSS_HYPR: 0.07                           # tau (KL)
  TEXT_LOSS_WEIGHT: 0.5                          # λ multiplier for dist_loss

INPUT:
  SIZE_TRAIN: [256, 128]
  SIZE_TEST: [256, 128]
  PROB: 0.5 # random horizontal flip
  RE_PROB: 0.5 # random erasing
  PADDING: 10
  PIXEL_MEAN: [0.5, 0.5, 0.5]
  PIXEL_STD: [0.5, 0.5, 0.5]

DATASETS:
  NAMES: ('msmt17')
  ROOT_DIR: ('/kaggle/working/MSMT17_V2')  # writable data copy

DATALOADER:
  SAMPLER: 'softmax_triplet'
  NUM_INSTANCE: 4
  NUM_WORKERS: 8

SOLVER:
  OPTIMIZER_NAME: 'SGD'
  MAX_EPOCHS: 120
  BASE_LR: 0.0004
  WARMUP_EPOCHS: 20
  IMS_PER_BATCH: 64
  WARMUP_METHOD: 'cosine'
  LARGE_FC_LR: False
  CHECKPOINT_PERIOD: 120
  LOG_PERIOD: 20
  EVAL_PERIOD: 120
  WEIGHT_DECAY:  1e-4
  WEIGHT_DECAY_BIAS: 1e-4
  BIAS_LR_FACTOR: 2

TEST:
  EVAL: True
  IMS_PER_BATCH: 256
  RE_RANKING: False
  WEIGHT: ''
  NECK_FEAT: 'before'
  FEAT_NORM: 'yes'

WANDB:
  ENABLE: True
  PROJECT: 'Cross-ReID-PersonViT'
  RUN_NAME: 'msmt17_kl_crossreid'
  ENTITY: ''
  TAGS: ('crossreid', 'vit_small', 'msmt17', 'dist_loss')
  NOTES: 'ViT-Small cross-modal ReID with similarity matrix dist_loss (KL) on MSMT17 masked variant'
  LOG_FREQ: 10

OUTPUT_DIR: 'log/transreid/msmt17v2/vit_small_crossreid'
