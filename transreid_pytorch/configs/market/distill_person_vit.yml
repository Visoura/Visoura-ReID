MODEL:
  PRETRAIN_PATH: '/kaggle/input/notebooks/davidmagdy/download-personvit-models/personvit_model/vits.lup.256x128.wopt.csk.4-8.ar.375.n8/checkpoint0260.pth'
  PRETRAIN_HW_RATIO: 2
  METRIC_LOSS_TYPE: 'triplet'
  IF_LABELSMOOTH: 'off'
  IF_WITH_CENTER: 'no'
  NAME: 'transformer'
  NO_MARGIN: True
  DEVICE_ID: ('0')
  TRANSFORMER_TYPE: 'vit_small_patch16_224_TransReID'
  STRIDE_SIZE: [16, 16]
  # STEM_CONV: True # False for vanilla ViT-S
  # DIST_TRAIN: True

  # ── Text Alignment (VLM) ──────────────────────────────────────────
  TEXT_EMB_PATH: 'scripts/qwen_8B_v1.pt'  # path to .pt text embedding file
  TEXT_EMB_BY_PID: True             # true = dict keyed by PID (per-identity); false = keyed by filename (per-image)
  TEXT_EMB_DIM: 768                # SigLIP2 output dimension

  # Projector mode (TEXT_PROJ_HEAD: true) — uses MLP projector + warmup
  TEXT_PROJ_HEAD: false             # false = use dist_loss family instead
  TEXT_ALIGN_WEIGHT: 0.3           # λ weighting (projector mode only)
  TEXT_ALIGN_LOSS: 'text_center'   # 'infonce' | 'text_center' | 'cosine' (projector mode)
  TEXT_ALIGN_TEMPERATURE: 0.1      # InfoNCE temperature (projector mode)
  TEXT_PROJ_WARMUP_EPOCHS: 10      # only active when TEXT_PROJ_HEAD: true

  # Dist-loss mode (TEXT_PROJ_HEAD: false) — similarity matrix losses
  TEXT_LOSS_TYPE: 'l1'             # 'l1' | 'mse' | 'huber' | 'kl'
  TEXT_LOSS_HYPR: 0.07             # tau (KL) / delta (Huber) / ignored (L1, MSE)
  TEXT_LOSS_WEIGHT: 0.5            # λ multiplier for dist_loss

INPUT:
  SIZE_TRAIN: [256, 128]
  SIZE_TEST: [256, 128]
  PROB: 0.5 # random horizontal flip
  RE_PROB: 0.5 # random erasing
  PADDING: 10
  PIXEL_MEAN: [0.5, 0.5, 0.5]
  PIXEL_STD: [0.5, 0.5, 0.5]

DATASETS:
  NAMES: ('market1501')
  ROOT_DIR: ('/kaggle/input/datasets/pengcw1/market-1501')

DATALOADER:
  SAMPLER: 'softmax_triplet'
  NUM_INSTANCE: 4
  NUM_WORKERS: 8

SOLVER:
  OPTIMIZER_NAME: 'SGD'
  MAX_EPOCHS: 120
  BASE_LR: 0.0004
  WARMUP_EPOCHS: 20
  IMS_PER_BATCH: 64
  WARMUP_METHOD: 'cosine'
  LARGE_FC_LR: False
  CHECKPOINT_PERIOD: 120
  LOG_PERIOD: 20
  EVAL_PERIOD: 10
  WEIGHT_DECAY:  1e-4
  WEIGHT_DECAY_BIAS: 1e-4
  BIAS_LR_FACTOR: 2

TEST:
  EVAL: True
  IMS_PER_BATCH: 256
  RE_RANKING: False
  WEIGHT: ''
  NECK_FEAT: 'before'
  FEAT_NORM: 'yes'

# ============================================================
# Distillation-specific configuration (DeiT-style dual-token)
# ============================================================
DISTILL:
  # Master switch. When false, training behaves EXACTLY as
  # vit_small_crossreid.yml (no DIST token, no distillation loss,
  # no architecture change). This is the backward-compatibility
  # guarantee.
  ENABLED: true

  # Path to teacher checkpoint (PersonViT-B/16, ReID-finetuned, frozen).
  TEACHER_CHECKPOINT_PATH: '/kaggle/input/notebooks/davidmagdy/download-personvit-models/personvit_model/vitb.lup.256x128.wopt.csk.4-8.ar.375.n8/checkpoint0260.pth'

  # Path to the cached teacher embeddings .pt file produced by
  # scripts/generate_teacher_embeddings.py. Must exist BEFORE this
  # training config is run; training will fail fast with a clear
  # error if this file is missing.
  TEACHER_EMBEDDINGS_PATH: '/kaggle/input/datasets/davidmagdy/teacher-embeds-vit-b/teacher_embeddings_b16.pt'

  # Which view the cached teacher embeddings were computed from.
  # Informational at training time — the actual choice happens when
  # running the generator script.
  TEACHER_CACHE_VIEW: 'deterministic'

  # Loss weight for the distillation term (static multiplier).
  LAMBDA: 1.0

  # Entrywise comparison function for the similarity matrices.
  # Passed through to loss/dist_loss.py. Options: l1, l2, huber
  MATRIX_LOSS_TYPE: 'l1'

  # Delta parameter for Huber loss; ignored for l1/l2.
  MATRIX_LOSS_HYPR: 0.3

  # Whether eval/inference embedding is average(CLS, DIST) (true)
  # or CLS-only (false). Forced to false when ENABLED is false.
  USE_DIST_TOKEN_AT_EVAL: true

  # DIST token initialisation strategy. Only "copy_cls" is currently
  # implemented — kept as an explicit key for future extension.
  DIST_TOKEN_INIT: 'copy_cls'

# ============================================================
# Weights & Biases
# ============================================================
WANDB:
  ENABLE: True
  PROJECT: 'Cross-ReID-PersonViT'
  RUN_NAME: 'distill_b16_to_s16'
  ENTITY: ''
  TAGS: ('crossreid', 'vit_small', 'market1501', 'distillation', 'deit')
  NOTES: 'DeiT-style dual-token distillation: PersonViT-B/16 teacher → PersonViT-S/16 student on Market-1501'
  LOG_FREQ: 10
  LOG_DISTILL_METRICS: true

OUTPUT_DIR: 'log/transreid/market/distill_person_vit'
