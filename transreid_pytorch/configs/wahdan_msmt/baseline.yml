MODEL:
  PRETRAIN_PATH: '/kaggle/working/weights/vit_small_pretrained.pth'
  PRETRAIN_HW_RATIO: 2
  METRIC_LOSS_TYPE: 'triplet'
  IF_LABELSMOOTH: 'off'
  IF_WITH_CENTER: 'no'
  NAME: 'transformer'
  NO_MARGIN: True
  DEVICE_ID: ('0')
  TRANSFORMER_TYPE: 'vit_small_patch16_224_TransReID'
  STRIDE_SIZE: [16, 16]
  TEXT_EMB_PATH: ''   # default points at scripts/qwen_8B_v1.pt, which would switch the text loss on
  # STEM_CONV: True # False for vanilla ViT-S
  # DIST_TRAIN: True

INPUT:
  SIZE_TRAIN: [256, 128]
  SIZE_TEST: [256, 128]
  PROB: 0.5 # random horizontal flip
  RE_PROB: 0.5 # random erasing
  PADDING: 10
  PIXEL_MEAN: [0.5, 0.5, 0.5]
  PIXEL_STD: [0.5, 0.5, 0.5]

DATASETS:
  NAMES: ('msmt17')
  ROOT_DIR: ('/kaggle/working/MSMT17_V2')  # same layout as configs/msmt17v2

DATALOADER:
  SAMPLER: 'softmax_triplet'
  NUM_INSTANCE: 4
  NUM_WORKERS: 8

SOLVER:
  OPTIMIZER_NAME: 'SGD'
  MAX_EPOCHS: 120
  BASE_LR: 0.0004
  WARMUP_EPOCHS: 20
  IMS_PER_BATCH: 64
  WARMUP_METHOD: 'cosine'
  LARGE_FC_LR: False
  CHECKPOINT_PERIOD: 120
  LOG_PERIOD: 20
  EVAL_PERIOD: 120
  WEIGHT_DECAY:  1e-4
  WEIGHT_DECAY_BIAS: 1e-4
  BIAS_LR_FACTOR: 2
  DETERMINISTIC: True

TEST:
  EVAL: True
  IMS_PER_BATCH: 256
  RE_RANKING: False
  WEIGHT: ''
  NECK_FEAT: 'before'
  FEAT_NORM: 'yes'

WANDB:
  ENABLE: True
  PROJECT: 'ReID-Loss-Ablation'
  RUN_NAME: 'baseline_msmt'
  ENTITY: ''
  TAGS: ('vit_small', 'msmt17', 'baseline')
  NOTES: 'Stock msmt17/vit_small.yml (120 epochs, batch 64)'
  LOG_FREQ: 10

OUTPUT_DIR: 'log/transreid/msmt17/baseline'
